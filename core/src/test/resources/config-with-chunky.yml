settings:
  locale: en
  max-concurrent-resets: 1

resource-worlds:
  mining:
    world-name: world_resource
    environment: NORMAL
    enabled: true
    auto-create: true
    seed:
      strategy: random
      values: []
    reset:
      strategy: in-place
      schedule:
        type: daily
        time: "05:00"
      warnings-minutes: [5, 1]
      gates: {}
      pause-autosave: true
      grace-warning: true
      chunky:
        enabled: true
        shape: square
        center: [100, -200]
        radius: 5000
        max-duration-minutes: 60
        block-teleport-during-pregen: true
        failure-behavior: critical
        notifications:
          bossbar: true
          actionbar: false
          discord: false
    teleport:
      mode: spawn
      safe-location: true
      destination-on-reset: world
    world-settings:
      difficulty: NORMAL
      gamerules: {}
    regions:
      enabled: false
      list: []
    copy-regions: {}
    notifications: {}
  hunting:
    world-name: world_hunting
    environment: NORMAL
    enabled: true
    auto-create: true
    seed:
      strategy: random
      values: []
    reset:
      strategy: in-place
      schedule:
        type: daily
        time: "05:00"
      warnings-minutes: []
      gates: {}
      pause-autosave: true
      grace-warning: true
      chunky:
        enabled: false
        shape: circle
        center: [0, 0]
        radius: 3000
    teleport:
      mode: spawn
      safe-location: true
      destination-on-reset: world
    world-settings:
      difficulty: NORMAL
      gamerules: {}
    regions:
      enabled: false
      list: []
    copy-regions: {}
    notifications: {}
  nochunky:
    world-name: world_noc
    environment: NORMAL
    enabled: true
    auto-create: true
    seed:
      strategy: random
      values: []
    reset:
      strategy: in-place
      schedule:
        type: daily
        time: "05:00"
      warnings-minutes: []
      gates: {}
      pause-autosave: true
      grace-warning: true
    teleport:
      mode: spawn
      safe-location: true
      destination-on-reset: world
    world-settings:
      difficulty: NORMAL
      gamerules: {}
    regions:
      enabled: false
      list: []
    copy-regions: {}
    notifications: {}
